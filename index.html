<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICO Office</title>
  </head>
  <body>
    <div id="stage">
      <canvas id="office" aria-label="Văn phòng agent"></canvas>
    </div>
    <header id="topbar" class="topbar glass">
      <span id="conn" class="conn">…</span>
      <div id="agents-count"></div>
      <button type="button" id="needs-count" disabled></button>
      <span id="tickets-error" role="status" hidden>!</span>
      <form id="settings" autocomplete="off">
        <input name="baseUrl" placeholder="http://localhost:8000" aria-label="Địa chỉ aico" autocomplete="off" />
        <input name="token" type="password" placeholder="API token" aria-label="API token" autocomplete="new-password" />
        <button type="submit">Kết nối</button>
      </form>
      <button type="button" id="demo">Demo</button>
    </header>
    <aside id="sidebar" class="sidebar glass" aria-label="Phòng và agent"></aside>
    <aside id="drawer" class="drawer glass" hidden>
      <aside id="needs" aria-label="Cần bạn" hidden></aside>
    </aside>
    <section id="feed" class="feed glass" aria-label="Hoạt động"></section>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
